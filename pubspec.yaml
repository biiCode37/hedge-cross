name: hedge_flutter
description: HEDGE — Headway Generator By Mikrotrans Utara.
publish_to: none
version: 2.0.2+3
environment:
  sdk: '>=3.10.4 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.3.1
  drift: 2.33.0
  path_provider: 2.1.5
  path: 1.9.1
  crypto: 3.0.6
  uuid: 4.5.1
  file_picker: 8.3.7
  share_plus: 12.0.1
  pdf: 3.11.3
  excel: 4.0.6
  flutter_local_notifications: 21.0.0
  timezone: 0.11.0
  wakelock_plus: 1.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/hedge-logo.jpg
  fonts:
    - family: HedgeRoboto
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
